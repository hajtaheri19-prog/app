name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ دریافت سورس
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ نصب Flutter (سازگار با Dart پروژه)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      # 3️⃣ نصب Java (سازگار با Android Gradle Plugin)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 4️⃣ نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5️⃣ نصب کامپوننت‌های لازم Android (CMake و ...)
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      # 6️⃣ Flutter doctor (داخل app)
      - name: Flutter doctor
        run: flutter doctor -v
        working-directory: app

      # 7️⃣ دریافت پکیج‌ها
      - name: Flutter pub get
        run: flutter pub get
        working-directory: app

      # 8️⃣ Build APK با entry point مشخص
      - name: Build release APK
        run: flutter build apk --release -t lib/main.dart
        working-directory: app

      # 9️⃣ آپلود خروجی APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
